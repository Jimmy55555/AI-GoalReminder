name: Daily Goal Digest

on:
  # 正式寄信已改由 Supabase pg_cron 每分鐘觸發 daily-digest Edge Function。
  # 這裡保留手動觸發以便除錯。
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EMAIL_TIME_ZONE: Taipei Standard Time
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: '587'
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-4-hydrogen' }}
      GEMINI_TIMEOUT_SECONDS: '20'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Send digest
        run: dotnet run --project Mailer/Mailer.csproj -c Release
